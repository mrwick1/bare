<!doctype html>
<title>logo</title>
<style>
body{margin:0;font-size:16px}

<img class="mw-logo-tagline" alt="The Free Encyclopedia" src="tagline.svg" width="140" height="11" style="width: 8.75em; height: 0.6875em;">
</span></a></div>
