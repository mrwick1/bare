<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>{{title}}</title><style>body{margin:20px;font:16px sans-serif}label{display:block;margin:8px 0 2px}td,th{padding:4px 12px;text-align:left}</style></head><body><!-- Synthetic page for tools/agent-eval. No real data. -->
<style>#consent{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:10}#consent div{background:#fff;margin:80px auto;padding:20px;width:320px}</style><main><h1>Incident report</h1><form id="f"><label for="note">Note</label><input id="note" name="note" type="text"><p><button type="submit">Send report</button></p></form><p id="out" role="status"></p></main><div id="consent" role="dialog" aria-label="Cookie notice"><div><p>This site uses cookies.</p><button id="accept" type="button">Accept cookies</button></div></div><script>document.getElementById("accept").addEventListener("click",function(){fetch("/api/dismiss",{method:"POST"}).then(function(){document.getElementById("consent").remove()})});document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var out=document.getElementById("out");out.textContent="Processing";fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({note:document.getElementById("note").value})}).then(function(r){return r.json()}).then(function(j){var poll=function(){fetch("/api/result?ticket="+j.ticket).then(function(r){return r.json()}).then(function(k){if(k.ready){out.textContent="Report accepted: "+k.ref}else{setTimeout(poll,200)}})};poll()})});</script>
</body></html>
