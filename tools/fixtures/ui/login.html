<!DOCTYPE html>
<html>
<head>
<title>Login fixture</title>
<style>
body { margin: 0; font-size: 20px; background: #fff; color: #000; }
h1 { position: absolute; left: 20px; top: 10px; margin: 0; font-size: 24px; }
.f { position: absolute; left: 20px; width: 300px; height: 36px; box-sizing: border-box; margin: 0; padding: 0 6px; border: 2px solid #555; font-size: 20px; }
#go { position: absolute; left: 20px; top: 230px; width: 140px; height: 40px; box-sizing: border-box; border: 2px solid #135; background: #cde; font-size: 20px; }
.t { position: absolute; left: 20px; margin: 0; }
</style>
</head>
<body>
<h1>Sign in</h1>
<form id="form" action="/none" novalidate>
  <input id="user" class="f" style="top:60px" type="text">
  <input id="pass" class="f" style="top:120px" type="password">
  <input id="chk" type="checkbox" style="position:absolute; left:20px; top:180px; width:24px; height:24px; margin:0">
  <label for="chk" class="t" style="top:182px; left:54px">remember</label>
  <button id="go" type="submit">Go</button>
</form>
<p id="focus" class="t" style="top:290px">focus: none</p>
<p id="out" class="t" style="top:330px">not submitted</p>
<script>
var $ = function (i) { return document.getElementById(i); };
document.addEventListener('focusin', function (e) { $('focus').textContent = 'focus: ' + e.target.id; });
$('form').addEventListener('submit', function (e) {
  e.preventDefault();
  $('out').textContent = 'submitted: user=' + $('user').value + ' pass=' + $('pass').value.length + ' chars remember=' + $('chk').checked + ' trusted=' + e.isTrusted;
});
</script>
</body>
</html>
