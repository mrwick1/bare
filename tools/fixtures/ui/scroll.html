<!doctype html>
<html><head><meta charset="utf-8"><style>
body { margin: 8px; font: 16px monospace }
#box { width: 200px; height: 100px; overflow: auto; border: 2px solid #000; padding: 5px }
#inner { height: 400px; width: 300px; background: #ccf }
#hid { width: 100px; height: 50px; overflow: hidden }
#hid div { height: 200px }
#tall { height: 1500px; background: #cfc }
#end { height: 20px }
#fx { position: fixed; left: 10px; top: 20px; width: 30px; height: 20px; background: #f00 }
</style></head><body>
<div id="box"><div id="inner"></div></div>
<div id="hid"><div></div></div>
<div id="tall"></div>
<div id="end"></div>
<div id="fx"></div>
<script>
window.__n = { win: 0, doc: 0, box: 0, hid: 0 };
window.addEventListener('scroll', function () { __n.win++ });
document.addEventListener('scroll', function () { __n.doc++ });
document.getElementById('box').addEventListener('scroll', function (e) { __n.box++; __n.boxBubbles = e.bubbles });
document.getElementById('hid').addEventListener('scroll', function () { __n.hid++ });
</script></body></html>
