<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; font-size: 16px; }
.b { position: absolute; width: 120px; height: 30px; box-sizing: border-box; margin: 0; padding: 0; }
/* Radix: while a modal dialog is open, body gets pointer-events none; the overlay and the content set auto again. */
#overlay { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; opacity: 0.5; z-index: 50; pointer-events: auto; }
#dlg { position: fixed; left: 100px; top: 100px; width: 250px; height: 200px; z-index: 51; pointer-events: auto; background: #fff; }
.z { position: absolute; width: 100px; height: 60px; left: 0; }
#nonep { pointer-events: none; }
#hid { visibility: hidden; }
#scroller { position: absolute; left: 10px; top: 520px; width: 200px; height: 60px; overflow: hidden; }
#far { position: absolute; left: 10px; top: 300px; width: 120px; height: 30px; }
#tall { height: 400px; position: relative; }
</style>
</head>
<body>
<div id="page" style="position:absolute; left:0; top:0; width:400px; height:500px">
  <button id="next" class="b" style="left:230px; top:20px" type="button">Next</button>
  <button id="other" class="b" style="left:10px; top:20px" type="button">Other</button>
  <div id="under2" class="b" style="left:10px; top:400px; background:#ccc"></div>
  <div id="under" class="b" style="left:150px; top:400px; background:#ccc"></div>
  <button id="nonep" class="b" style="left:10px; top:400px" type="button">Nopointer</button>
  <button id="hid" class="b" style="left:150px; top:400px" type="button">Hidden</button>
  <div id="stack" style="position:absolute; left:10px; top:440px; width:100px; height:60px">
    <div id="z1" class="z" style="z-index:1; background:#f00"></div>
    <div id="z3" class="z" style="z-index:3; left:20px; top:10px; background:#0f0"></div>
    <div id="z2" class="z" style="z-index:2; left:40px; top:20px; background:#00f"></div>
  </div>
</div>
<div id="scroller">
  <div id="tall"><button id="far" type="button">Far</button></div>
</div>
<div id="overlay"></div>
<div id="dlg" role="dialog">
  <button id="ok" class="b" style="left:10px; top:10px" type="button">Ok</button>
  <button id="cancel" class="b" style="left:10px; top:60px" type="button">Cancel</button>
</div>
<div id="blank" style="position:absolute; left:300px; top:600px; width:50px; height:50px"></div>
<script>
window.__log = [];
var types = ['pointerover','pointerenter','pointerdown','pointermove','pointerup','pointerout','pointerleave','mouseover','mouseenter','mousemove','mousedown','mouseup','mouseout','mouseleave','click','focus','blur'];
function id(t) { return t === window ? 'window' : t === document ? 'document' : (t.id || t.nodeName.toLowerCase()); }
types.forEach(function (t) {
  window.addEventListener(t, function (e) {
    var p = [];
    if (/^(pointer|mouse|click)/.test(t)) p.push('x=' + e.clientX, 'y=' + e.clientY, 'buttons=' + e.buttons, 'related=' + (e.relatedTarget ? id(e.relatedTarget) : 'null'));
    window.__log.push(t + ' @' + id(e.target) + ' ' + p.join(' '));
  }, true);
});
['pointerenter','pointerleave','mouseenter','mouseleave'].forEach(function (t) {
  Array.prototype.forEach.call(document.querySelectorAll('*'), function (el) { el.addEventListener(t, function () {}); });
});
function app(s) { window.__log.push('app ' + s); }
document.body.style.pointerEvents = 'none';
// Click on the overlay closes the dialog and gives the page its pointer events back, as Radix does on an outside press.
document.getElementById('overlay').addEventListener('click', function () {
  document.getElementById('overlay').hidden = true; document.getElementById('dlg').hidden = true; document.body.style.pointerEvents = ''; app('closed');
});
['next', 'other', 'ok', 'cancel', 'nonep', 'hid', 'under', 'under2', 'z1', 'z2', 'z3'].forEach(function (n) {
  document.getElementById(n).addEventListener('click', function () { app('click ' + n); });
});
</script>
</body>
</html>
