# The workspace: one repository, several crates. Each crate is one part of the browser.
# A crate can only use another crate that it lists under [dependencies], and only that
# crate's `pub` items. Cargo builds each crate on its own, so a change in `net` does not
# rebuild `unicode`.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
strip = true

# Keep the interpreter in one codegen unit to reduce changes in its hot loop between builds.
[profile.release.package.bare-vex]
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
