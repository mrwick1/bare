# JavaScript: the new engine (docs/design-engine-rewrite.md, docs/plan-engine-rewrite.md). It runs no scripts yet.
# Only the `cell`, `heap`, `string`, `atoms`, `shapes`, `object` and `gc` modules may hold `unsafe` code; CI runs them under Miri.
[package]
name = "bare-js2"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND Unicode-3.0"

[dependencies]
bare-os = { path = "../os" }
# ID_Start and ID_Continue for the lexer (`lex.rs`); the compiled data of the property sets, as in `bare-js`
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
