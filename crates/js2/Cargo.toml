# JavaScript: the new engine (docs/design-engine-rewrite.md, docs/plan-engine-rewrite.md). It runs no scripts yet (the interpreter runs hand-written bytecode).
# Only the `cell`, `heap`, `string`, `atoms`, `shapes`, `object`, `blob`, `gc`, `interp_rt`, `interp` and `api` modules may hold `unsafe` code; CI runs them under Miri.
[package]
name = "bare-js2"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND Unicode-3.0"

[dependencies]
bare-os = { path = "../os" }
bare-js-api = { path = "../js-api" }
# NFC and NFD for `String.prototype.normalize`; case folding and the property sets of `\p{}` for the RegExp engine (`regexp.rs`)
bare-unicode = { path = "../unicode" }
# ID_Start and ID_Continue for the lexer (`lex.rs`); the compiled data of the property sets, as in `bare-js`
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }

[features]
# Count the executed ops, pairs and triples (`src/opcount.rs`, example `op_count`). Off by default: the normal build has no call into it.
op-count = []

[[example]]
name = "op_count"
required-features = ["op-count"]
