# JavaScript: lexer (S2 topic 2). Workspace dependencies only.
[package]
name = "bare-js"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND Unicode-3.0"

[features]
# Counters in the bytecode loop (`tools/js/bc_hist.sh`). Off by default: the loop compiles to the same code.
bc-hist = []
# Poison mode of the bytecode loop (always on in unit tests): code of another script runs with an empty current script, so a read
# of the code tables without `bc_sync` panics. For `tools/js/exec_diff.sh` on a build with this feature.
bc-poison = []
# Feature census (`src/census.rs`): counts syntax kinds and native built-in calls, written to `BARE_JS_CENSUS` when a realm ends.
census = []

[dependencies]
bare-intl = { path = "../intl" }
bare-js-api = { path = "../js-api" }
bare-observe = { path = "../observe" }
bare-os = { path = "../os" }
bare-tzdata = { path = "../tzdata" }
bare-unicode = { path = "../unicode" }
fixed_decimal = "0.7.3"
icu_properties = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
stacker = "0.1.25"
