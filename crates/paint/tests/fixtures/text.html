<!doctype html>
<style>
body { margin: 8px; font-size: 16px }
.big { font-size: 32px; color: #c00 }
.small { font-size: 10px; color: #060 }
.up { text-transform: uppercase }
.u { text-decoration: underline }
.s { text-decoration: line-through }
.narrow { width: 100px; background: #eef }
.pre { white-space: pre }
.mark { background: #ff0 }
</style>
<p>Hello, world! 0123456789</p>
<div class="big">Big Text</div>
<div class="small">small text with more words in it</div>
<div class="up">upper case</div>
<div class="u">underline</div>
<div class="s">strike</div>
<div class="narrow">a narrow block that wraps its words</div>
<div class="pre">pre   spaces</div>
<div>a <span class="mark">marked <b>word</b></span> here</div>
<ul><li>one</li><li>two</li></ul>
