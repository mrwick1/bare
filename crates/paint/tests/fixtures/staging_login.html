<!doctype html>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f3f4f6; font-family: sans-serif; font-size: 14px; color: #111827 }
.card { width: 340px; margin: 24px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px }
h1 { font-size: 20px; margin: 0 0 4px }
.sub { color: #6b7280; margin: 0 0 16px }
label { display: block; font-weight: 600; margin: 12px 0 4px }
input[type=email], input[type=password] { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: #fff }
.row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0 }
.row label { display: flex; align-items: center; font-weight: 400; margin: 0 }
.row input { margin: 0 6px 0 0 }
a { color: #2563eb }
button { width: 100%; padding: 10px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600 }
.hint { margin-top: 12px; text-align: center; color: #6b7280; font-size: 12px }
.badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; background: #dcfce7; color: #166534; font-size: 12px }
</style>
<div class="card">
<h1>Sign in</h1>
<p class="sub">Welcome back <span class="badge">staging</span></p>
<label>Email</label><input type="email" value="arjun@example.com">
<label>Password</label><input type="password" value="hunter2hunter2">
<div class="row"><label><input type="checkbox" checked>Remember me</label><a href="#">Forgot?</a></div>
<button>Sign in</button>
<div class="hint">Total due ₹1,299 … see plan</div>
</div>
