<!doctype html>
<style>

label { display: block; margin-top: 8px; color: #374151 }

button { margin-top: 16px; padding: 6px 12px; background: #2563eb; color: #fff; border: 0 }
.err { color: #b91c1c; margin-top: 8px }
</style>
<div class="card">
<h1>Sign in</h1>
<label>Email</label><input type="text" value="a@b.c">
