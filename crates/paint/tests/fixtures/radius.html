<!doctype html>
<style>
body { margin: 0 }
div { position: absolute; width: 60px; height: 30px }
.a { left: 10px; top: 10px; background: #2563eb; border-radius: 8px }
.b { left: 90px; top: 10px; background: #fff; border: 2px solid #111; border-radius: 12px }
.c { left: 170px; top: 10px; background: #10b981; border-radius: 50% }
.d { left: 250px; top: 10px; background: #ef4444; border-radius: 30px 4px 0 10px }

.f { left: 90px; top: 60px; border: 2px dashed #000 }
.g { left: 170px; top: 60px; border: 3px dashed #000 }
.h { left: 250px; top: 60px; border: 1px dotted #000 }
.i { left: 10px; top: 110px; border: 2px dotted #000 }
.j { left: 90px; top: 110px; border: 3px dotted #000 }
.k { left: 170px; top: 110px; border: 6px dotted #000 }
.l { left: 250px; top: 110px; border: 0.4px solid #000 }
.m { left: 10px; top: 160px; border: 5px solid #1e3a8a; background: #bfdbfe; border-radius: 20px; width: 100px; height: 40px }
.n { left: 150px; top: 160px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; width: 120px; height: 40px }

<div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div>
<div class="e"></div><div class="f"></div><div class="g"></div><div class="h"></div>
