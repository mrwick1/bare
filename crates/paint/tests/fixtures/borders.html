<!doctype html>
<style>
body { margin: 10px; background: #fff }
div { margin-bottom: 10px; height: 30px; width: 120px }
.all { border: 4px solid #000 }
.sides { border-style: solid; border-width: 1px 2px 3px 4px; border-color: #f00 #0a0 #00f #fa0 }
.one { border-left: 8px solid #909 }
.hidden { border: 5px hidden #f00 }
.dashed { border: 3px dashed #333 }
.box { background: #cfc; border: 3px solid #060; padding: 5px; width: 60px }
.tall { border: 20px solid #888; height: 5px; width: 5px }
</style>
<div class="all"></div>
<div class="sides"></div>
<div class="one"></div>
<div class="hidden"></div>
<div class="dashed"></div>
<div class="box"></div>
<div class="tall"></div>
