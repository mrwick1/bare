# Networking: DNS and HTTP. Later TCP details and TLS.
[package]
name = "bare-net"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bare-url = { path = "../url" }
bare-tls = { path = "../tls" }
# `flate2` (gzip, deflate) takes its pure Rust `miniz_oxide` backend, which `png` in `bare-paint` already builds. `brotli-decompressor` only decodes.
flate2 = "1.1"
brotli-decompressor = "5"
