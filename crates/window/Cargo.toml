# The window: a small interface that shows a pixel buffer, and a Wayland backend for it.
[package]
name = "bare-window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustix = { version = "1.1.6", features = ["event"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false }

[dev-dependencies]
memmap2 = "0.9.12"
wayland-protocols = { version = "0.32.13", features = ["server"] }
wayland-server = "0.31.14"
