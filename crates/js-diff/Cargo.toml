# Gate tools of the engine rewrite (docs/plan-engine-rewrite.md, gate S2 and the check of S3): both engines in one process, so the test262
# runner and the differential runner run the same script on the old engine (`bare-js`) and on the new one (`bare-vex`). No other dependency except the host interface (`bare-js-api`) for the module runner.
[package]
name = "bare-js-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bare-js = { path = "../js" }
bare-vex = { path = "../vex" }
bare-js-api = { path = "../js-api" }
