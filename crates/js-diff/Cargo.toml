# Gate tools of the engine rewrite (docs/plan-engine-rewrite.md, gate S2 and the check of S3): both engines in one process, so the test262
# runner and the differential runner run the same script on the old engine (`bare-js`) and on the new one (`bare-js2`). No other dependency.
[package]
name = "bare-js-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
bare-js = { path = "../js" }
bare-js2 = { path = "../js2" }
