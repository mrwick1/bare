# The browser app. It connects the other crates.
[package]
name = "bare"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bare-observe = { path = "../observe" }
bare-css = { path = "../css" }
bare-html = { path = "../html" }
bare-image = { path = "../image" }
bare-js-api = { path = "../js-api" }
bare-vex = { path = "../vex" }
bare-layout = { path = "../layout" }
bare-net = { path = "../net" }
bare-os = { path = "../os" }
bare-paint = { path = "../paint" }
bare-tls = { path = "../tls" }
bare-url = { path = "../url" }
bare-window = { path = "../window" }
# `CompressionStream` (`browser_shims.rs`). `bare-net` already builds both.
crc32fast = "1"
miniz_oxide = "0.9"
psl = "=2.1.253"

[dev-dependencies]
serde_json = "1"
