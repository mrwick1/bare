# The browser app. It connects the other crates.
[package]
name = "bare"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bare-css = { path = "../css" }
bare-html = { path = "../html" }
bare-image = { path = "../image" }
bare-js = { path = "../js" }
bare-layout = { path = "../layout" }
bare-net = { path = "../net" }
bare-paint = { path = "../paint" }
bare-tls = { path = "../tls" }
bare-url = { path = "../url" }
bare-window = { path = "../window" }
# `CompressionStream` (`browser_shims.rs`). `bare-net` already builds both.
crc32fast = "1"
miniz_oxide = "0.9"
