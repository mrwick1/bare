# Image decoders: PNG, JPEG, WebP and GIF into 0xAARRGGBB pixels, with hard limits. SVG is not here: paint draws it.
[package]
name = "bare-image"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
png = "0.18"
zune-jpeg = "0.5"
image-webp = "0.2"
# Without `color_quant`: that feature only encodes.
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
