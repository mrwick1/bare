name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Branch protection on main requires these jobs. Automatic fix runs merge
  # their own PRs, so these checks are the gate for every merge.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      # The skipped test needs six 500 M-step script aborts inside a 120 s
      # budget. A hosted runner takes about 30 s per abort in a debug build,
      # so the test times out there. It still runs on local machines.
      - run: cargo test --workspace --locked -- --skip a_page_that_aborts_task_after_task_fails_the_step_with_the_reason
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p bare-mcp -p bare-drive
  # Automatic fix runs push autofix/* branches. They must not change the
  # workflows, because the workflows are the merge gate.
  guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'autofix/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep '^\.github/'; then
            echo "autofix branches must not change .github/" >&2
            exit 1
          fi
