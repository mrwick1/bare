name: ci
on:
  pull_request:
    # `closed` starts a run that only cancels the run of the PR (concurrency below); its jobs are skipped.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
permissions:
  contents: read
# A new push to a PR, or its merge or close, cancels the run of its older commit. A new push to main cancels the older run on main.
concurrency:
  group: ci-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true
jobs:
  # Branch protection on main requires these jobs. Automatic fix runs merge
  # their own PRs, so these checks are the gate for every merge.
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      # Skipped here, still run on local machines:
      # - a_page_that_aborts_task_after_task_...: needs six 500 M-step script
      #   aborts inside a 120 s budget; a hosted runner takes about 30 s per
      #   abort in a debug build.
      # - an_expired_or_not_yet_valid_leaf_is_refused and
      #   certificate_checks_are_the_same_as_for_tls13: use `openssl x509
      #   -not_before`, which the runner's OpenSSL 3.0 does not have.
      # - ecdhe_key_exchange_with_x25519_and_with_p256: the runner's
      #   `openssl s_server` refuses the group list `P-256:P-256`.
      - run: >-
          cargo test --workspace --locked --no-fail-fast --
          --skip a_page_that_aborts_task_after_task_fails_the_step_with_the_reason
          --skip an_expired_or_not_yet_valid_leaf_is_refused
          --skip certificate_checks_are_the_same_as_for_tls13
          --skip ecdhe_key_exchange_with_x25519_and_with_p256
      # The tests that both engines must pass (`crates/js-api/src/suite.rs`); the feature keeps them out of the workspace run.
      - run: cargo test --locked -p bare-js-api --features suite
  windows:
    if: github.event.action != 'closed'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p bare-mcp -p bare-drive
  # The new engine (crates/js2): only its `cell`, `heap`, `string`, `atoms`, `shapes`, `object`, `gc`,
  # `interp_rt`, `interp`, `api`, `api_host`, `codes` and `blob` modules may hold `unsafe` code, so the tests of these modules run under Miri.
  # A filter is a substring of the test path, so a few tests of other modules (for example `bi_object::`) also run.
  miri:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - run: 'cargo miri test --locked -p bare-js2 --lib -- cell:: heap:: string:: atoms:: shapes:: blob:: gc:: object:: codes:: interp_rt:: interp:: api:: api_host::'
  # Automatic fix runs push autofix/* branches. They must not change the
  # workflows, because the workflows are the merge gate.
  guard:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && startsWith(github.head_ref, 'autofix/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | grep '^\.github/'; then
            echo "autofix branches must not change .github/" >&2
            exit 1
          fi
