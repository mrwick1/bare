name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p bare-mcp -p bare-drive
      - name: Rename binaries
        shell: bash
        run: |
          mkdir dist
          for b in bare-mcp bare-drive; do
            cp "target/${{ matrix.target }}/release/${b}${{ matrix.ext }}" "dist/${b}-${{ matrix.suffix }}${{ matrix.ext }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bare-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  # offstage installs the newest release, so a release reaches every agent at once.
  # Run offstage's real-Bare test against the candidate before it is published.
  gate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bare-linux-amd64
          path: bin
      - name: Put the candidate on PATH
        working-directory: bin
        run: |
          mv bare-mcp-linux-amd64 bare-mcp
          mv bare-drive-linux-amd64 bare-drive
          chmod +x bare-mcp bare-drive
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install runtime packages
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon0
      - uses: actions/checkout@v4
        with:
          repository: mrwick1/offstage
          ref: beta
          path: offstage
      - uses: actions/setup-go@v5
        with:
          go-version-file: offstage/go.mod
          cache-dependency-path: offstage/go.sum
      - name: Run the offstage browser test
        working-directory: offstage
        # The test skips when it finds no Bare. A skip must fail the gate.
        run: |
          out=$(go test ./internal/mcpserver -run '^TestBareBrowser$' -count=1 -v 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          grep -q -- '--- PASS: TestBareBrowser' <<<"$out" || { echo "TestBareBrowser did not run against Bare"; exit 1; }

  release:
    needs: [build, gate]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
